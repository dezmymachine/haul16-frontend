# Netlify build for the HAUL16 operator console (branch `live`). Vercel keeps using vercel.json; each host reads only its own file.
[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# The app calls relative /api/... URLs, so Netlify proxies them to the Railway backend. The browser only ever talks to this site,
# which keeps the sign-in cookie (SameSite=Lax) working and needs no CORS. Must come before the catch-all below.
[[redirects]]
  from = "/api/*"
  to = "https://haul16-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

# Single-page app: every other path serves the shell (real files such as /assets/* are served first).
[[redirects]]
  from = "/*"
  to = "/_shell.html"
  status = 200
